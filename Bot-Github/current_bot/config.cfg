cargo_ship.reserve_ore  = 10M
cargo_ship.reserve_gold = 10M


# Automatic Gathering
# Disabled 2026-09-14: world-offset dispatch regressed to zero server acks
# (was a real camp march at offset 0). Re-enable only after a clean capture.
gathering = true

# Prefer the highest-level resource tiles first.
gathering.highest_level_first = true

# Prefer the lowest available troop tier for gathering.
gathering.low_tier_first = true

# Leave one troop at home as a conservative spare.
gathering.spare_army = true

# 0 = use all currently available march slots.
gathering.max_armies = 0

# Delay between dispatches.
gathering.delay_seconds = 5

# Maximum estimated travel time.
gathering.max_travel_seconds = 900

# Minimum resource count required on a tile.
gathering.minimum_tile_count = 1

# Resource filters.
gathering.resource_food = true
gathering.resource_stone = true
gathering.resource_ore = true
gathering.resource_wood = true
gathering.resource_gold = true
gathering.resource_gems = false

# Tile level filters.
gathering.level_1 = true
gathering.level_2 = true
gathering.level_3 = true
gathering.level_4 = true
gathering.level_5 = true
gathering.hero_1 = 0
# gathering.hero_2..5 may remain 0

# Destination coordinate space for the sparse-6615 gather dispatch.  Scanned
# tiles are home-scale; this kingdom-battle venue's nodes live at world
# X = tile.x + 20562, Y = tile.y + 67 (byte-verified 2026-09-13).  Without these
# the server can't resolve a gather node and answers subcommand=4 (standby) or a
# CAMP march (type 6), never a gather (type 7).  0,0 = plain home-scale.
# Disabled GBG/Chaos world offsets for kingdom venue; must be 0 so PointCode not corrupted
gathering.world_x_offset = 0
gathering.world_y_offset = 0

# How wide the 2220 map scan sweeps outward (in zones) from the player's block
# before find_tile dispatches.  Default (unset) is only 4 zones, which in a
# city-dense region returns only player castles (kind 8) and never any resource
# field (kinds 1..6), so the tile cache stays empty and gathering never fires.
# Raise it so real resource fields beyond the castle ring reach the cache.
gathering.scan_reach = 24

# Gather protocol selection:
#   gathering.send_2415 = true    -> use 2415 with full 141-byte MarchEventData (self-contained zone/point/kind/level)
#   gathering.send_6615_fat = true -> use 6615 with 175-byte body (OLD fat, experimental)
#   gathering.send_6615_sparse = true -> use 6615 with 111-byte body (captured lean format, requires 2x OpenUI)
# DEFAULT (all false): 141-byte MarchEventData over 6615 (_MSG_REQUEST_TROOPMARCH_NOTATK)
# This matches the reference bot's working path (zone/point/kind/level in packet, no OpenUI needed).
gathering.send_2415 = true
gathering.send_6615_fat    = false
gathering.send_6615_sparse = false

