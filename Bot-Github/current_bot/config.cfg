# ---- 3179 polymorphic kind-byte testing (2026-09-14) ----
# achievement.kind_override: 0 = use server-reported kind (default 0x12 SoloBattle),
#   0x0f = BPDailyMission, 0x0d = UISlotMgr.  Forces the discriminator for all prizes.
achievement.kind_override    = 0x12
# Route daily-mission (11872) and quest-chapter (2059) rewards through 3179 kind 0x0f
# instead of the legacy flat msg ids.  Leave false to keep legacy.
claim.daily_mission_via_3179 = false
claim.quest_chapter_via_3179 = false
