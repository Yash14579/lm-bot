oldplayerback.auto_claim    = false
gift_activity.auto_claim    = false
quest_chapter.auto_claim    = false
daily_mission.auto_claim    = false
achievement.auto_claim      = false

# ============================================================================
# PER-SUBSYSTEM AUTOMATION SWITCHES (2026-09-16)
# Each line toggles ONE Auto*Tick in src/automation.c.  All are OFF by default
# here because they issue their own reward/claim/combat requests, and several
# (claim + pet/hero/item) previously fired spurious requests on the first
# AutomationTick and dropped the server connection.  Flip a line to true only if
# you have verified the subsystem behaves on this account.
#
# SAFE, already-verified paths (see top of file): building, research, training,
# economy, alliance, map.  GameAssets cost/tier data is wired into those.
# ============================================================================

