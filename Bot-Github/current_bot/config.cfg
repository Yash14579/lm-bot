# ============================================================================
# MASTER AUTOMATION MATRIX
# Each domain is independently switchable. War automation is intentionally off.
# ============================================================================
automation.enabled   = true
automation.building   = true
automation.research   = true
automation.training   = true
automation.traps      = true
automation.hospital   = true
automation.hunting    = true
automation.quests     = true
automation.activities = true
automation.alliance   = true
automation.mail       = true
automation.economy    = true
automation.map        = true
automation.war        = false

# Lords Mobile Bot Configuration
# Queue automation settings
building.max_level = 25
building.lowest_level_first = true

research.auto_start = true
research.complete_free = true
research.instant = false
research.max_level = 10
research.priority = 6,8,74,123,125,143,228,229,234,299,301,302,303,305

training.auto_start = true
training.kind = 0
training.tier = 3
# Train the highest-tier troops this account can actually train. The bot starts
# at training.tier (here T4 / tier 3, 0-based) and, if the server rejects a
# tier as unavailable, steps down (T3, T2, ...) until a tier is accepted.
training.highest_tier = true
training.batch = 1000

# ---- Bag-resource top-up when on-hand stock is low ----
# When the account lacks on-hand resources for a build/research/train, spend a
# matching resource pack from the bag to cover it so the server accepts the
# request instead of rejecting it.
automation.use_bag_rss = true
# Per-resource floor (food/wood/rock) kept topped up from the bag for
# building and research before a request is sent.
automation.rss_floor   = 10M

hospital.auto_heal = true
hospital.instant_heal = false

